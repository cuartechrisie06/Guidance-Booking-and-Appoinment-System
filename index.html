<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GSTC Portal – UM Tagum College</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#ebe7e5;--sf:#fff;--bd:#dfbfbc;--ln:#e8dad7;--mr:#570005;--rd:#7b1113;--gd:#775a00;--tx:#111c2d;--mu:#58413f;--ti:#faf8f7;--bl:#f0f3ff;--ro:#f7eceb;--gb:#edf5ef;--gt:#286044;--ab:#fff6df;--yl:#e8b923;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1615;--sf:#241d1c;--bd:#4a3836;--ln:#3a2e2c;--mr:#ffb3ac;--gd:#e6c365;--tx:#f1e9e7;--mu:#c9b5b2;--ti:#2a2221;--bl:#252a3a;--ro:#3a2527;--gb:#1f3328;--gt:#8fd1a9;--ab:#3a3018}}
:root[data-theme=dark]{--bg:#1b1615;--sf:#241d1c;--bd:#4a3836;--ln:#3a2e2c;--mr:#ffb3ac;--gd:#e6c365;--tx:#f1e9e7;--mu:#c9b5b2;--ti:#2a2221;--bl:#252a3a;--ro:#3a2527;--gb:#1f3328;--gt:#8fd1a9;--ab:#3a3018}
*{box-sizing:border-box;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:400 12px/1.4 "Public Sans",system-ui,sans-serif}
.m{font-family:"JetBrains Mono",monospace}a{cursor:pointer}button{font:inherit;cursor:pointer}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.cr{background:#570005;color:#fff;padding:8px 24px;display:flex;justify-content:space-between;gap:12px;font-size:11px;flex-wrap:wrap}.cr b{background:#775a00;padding:2px 6px;border-radius:2px;font:10px "JetBrains Mono"}
.nv{background:var(--sf);border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.br{display:flex;align-items:center;gap:12px}.lg{width:44px;height:44px;background:#570005;border:2px solid #775a00;border-radius:2px;color:#fff;font-weight:700;display:grid;place-items:center}
.br b{color:var(--mr);font-size:15px;display:block}.br small{color:var(--mu)}
.ut{display:flex;align-items:center;gap:16px;color:var(--mu);font-weight:600}
.sw{border:1px solid var(--bd);background:var(--sf);color:var(--mr);padding:6px 10px;border-radius:2px;font-weight:600}
.ws{display:flex;min-height:80vh}aside{width:230px;flex:none;background:var(--sf);border-right:1px solid var(--bd);padding:16px;display:flex;flex-direction:column;justify-content:space-between;gap:16px}
aside h3{color:var(--mr);font-size:15px}aside p{color:var(--mu);margin-bottom:16px}
.ni{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:2px;color:var(--mu);font-weight:500;margin-bottom:4px}.ni:hover{background:var(--ti)}
.ni.on{background:var(--rd);color:#fff;font-weight:700}
.hot{background:var(--bl);border:1px solid var(--bd);padding:10px;margin-top:16px;font-size:10px;color:var(--mu)}.hot b{display:block;color:var(--tx);font-size:11px}
main{flex:1;min-width:0;padding:28px;display:flex;flex-direction:column;gap:20px}
h1{font-size:26px;line-height:34px}.sub{color:var(--mu);margin-top:4px}.cb{font-size:10px;color:var(--gd);margin-bottom:5px}
.hd{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.cd{background:var(--sf);border:1px solid var(--bd);border-radius:2px}.pd{padding:20px}
.sh{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--ln);gap:10px}.sh b{font-size:15px;display:block}.sh small,.mu{color:var(--mu)}
.bt{height:36px;padding:0 16px;border:1px solid var(--bd);background:var(--sf);color:var(--mr);font-weight:600;border-radius:2px}.bt:hover{background:var(--ro)}
.bt.p{background:var(--rd);border-color:var(--rd);color:#fff}.bt.y{background:var(--yl);border-color:var(--yl);color:#3a2b00}.bt.s{height:30px;padding:0 10px;font-size:11px}
.lk{color:var(--mr);font-weight:600;background:none;border:0}
.gr{display:grid;gap:12px}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:1fr 340px;align-items:start}.g3{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
@media(max-width:1000px){.g2{grid-template-columns:1fr}}@media(max-width:760px){.ws{flex-direction:column}aside{width:100%}main{padding:16px}}
.mt{padding:16px}.mt .n{font-size:28px;font-weight:700;color:var(--mr)}.mt small{color:var(--mu)}
.st{padding:3px 8px;border-radius:99px;font-weight:600;font-size:11px;display:inline-block;white-space:nowrap}
.Pending{background:var(--ab);color:var(--gd)}.Approved,.Completed{background:var(--gb);color:var(--gt)}.Rescheduled{background:var(--bl);color:#2c4a9a}.Cancelled,.Declined{background:var(--ro);color:var(--rd)}
.tb{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:720px}th{text-align:left;font-weight:500;color:var(--mu);padding:12px 16px;background:var(--ti)}td{padding:12px 16px;border-top:1px solid var(--ln);vertical-align:middle}td small{display:block;color:var(--mu)}
.ac{display:flex;gap:6px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.tabs{display:inline-flex;background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:3px;gap:2px;flex-wrap:wrap}.tabs button{border:0;background:none;padding:6px 12px;border-radius:5px;color:var(--mu);font-weight:500}.tabs .on{background:var(--rd);color:#fff}
input,select,textarea{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:2px;padding:9px 10px;width:100%}label{display:block;font-weight:600;margin:12px 0 5px}
.opt{border:1px solid var(--bd);border-radius:2px;padding:14px;background:var(--sf);cursor:pointer;text-align:left;color:var(--tx)}.opt.on{border:2px solid var(--rd);background:var(--bl)}.opt b{display:block;margin-bottom:6px;font-size:13px}.opt small{color:var(--mu)}
.stp{width:22px;height:22px;border-radius:50%;background:#570005;color:#fff;display:inline-grid;place-items:center;font-size:11px;margin-right:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}.cal button{height:32px;border:0;background:none;color:var(--tx);border-radius:2px}.cal .x{color:var(--mu);opacity:.4;text-decoration:line-through;cursor:not-allowed}.cal .on{background:var(--rd);color:#fff}.cal button:not(.x):hover{background:var(--ro)}
.sl{padding:10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:2px;text-align:left}.sl.on{background:var(--rd);color:#fff}.sl.x{background:var(--bl);text-decoration:line-through;color:var(--mu);cursor:not-allowed}
.bar{height:10px;background:var(--ln);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--rd)}
.mdl{position:fixed;inset:0;background:#0007;display:grid;place-items:center;z-index:9;padding:16px}.mdl>div{background:var(--sf);border-radius:4px;padding:22px;width:min(460px,100%);max-height:90vh;overflow:auto}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111c2d;color:#fff;padding:10px 18px;border-radius:4px;z-index:10;display:none}
.lw{max-width:1000px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:1fr 440px;gap:24px}@media(max-width:900px){.lw{grid-template-columns:1fr}}
details{border-top:1px solid var(--ln);padding:12px 0}summary{font-weight:600;cursor:pointer}
.un{width:6px;height:6px;border-radius:3px;background:var(--rd);display:inline-block;margin-left:6px}
</style></head><body><div id="app"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const day=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
const fmt=i=>new Date(i+'T00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const IC={dash:'M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z',cal:'M8 2v4M16 2v4M3 10h18M3 4h18v18H3z',users:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8M22 21v-2a4 4 0 0 0-3-3.9',book:'M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z',chart:'M3 3v18h18M7 14l4-4 4 4 5-6',plus:'M12 5v14M5 12h14',shield:'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'};
const ic=n=>`<svg viewBox="0 0 24 24"><path d="${IC[n]}"/></svg>`;
const SL=['8:30 AM','9:30 AM','10:30 AM','1:30 PM','2:30 PM','3:30 PM'];
const C=[{id:'c1',n:'Maria Elena Santos',cr:'MS, RGC',r:'Senior Counselor',col:'College of Computing Education (CCE)',rm:'GCC Room 204'},{id:'c2',n:'Arthur P. Tan',cr:'PhD, RGC',r:'Lead Psychologist',col:'College of Teacher Education (CTE)',rm:'GCC Room 201'},{id:'c3',n:'Clarissa Mae Gomez',cr:'RPm',r:'Psychometrician',col:'College of Business Administration (CBA)',rm:'GCC Room 205'}];
const SV=[['Academic Performance & Study Habits','45-60 Mins','Course load, grades, test anxiety, probation and study strategies.'],['Career & Vocational Guidance','45 Mins','Career pathways, major shift, internship readiness and board prep.'],['Personal / Emotional Well-being','60 Mins','Stress management, relationships, family concerns, grief.'],['Routine Interview / Clearance','30 Mins','Annual intake, transferees, scholarship verification, clearance signing.'],['Exit Interview','30 Mins','For graduating or transferring students.']];
const cn=id=>C.find(c=>c.id==id)?.n||'';
const seed=()=>({user:null,id:10,bk:[
{id:1,sid:'145976',stu:'Juan Dela Cruz Jr.',sub:'BSIT 3rd Yr',svc:1,cn:'c1',date:day(3),time:'9:30 AM',st:'Approved'},
{id:2,sid:'145976',stu:'Juan Dela Cruz Jr.',sub:'BSIT 3rd Yr',svc:2,cn:'c2',date:day(6),time:'1:30 PM',st:'Pending'},
{id:3,sid:'145976',stu:'Juan Dela Cruz Jr.',sub:'BSIT 3rd Yr',svc:0,cn:'c3',date:day(-12),time:'8:30 AM',st:'Completed'},
{id:4,sid:'148201',stu:'Maria Santos',sub:'BSIT 2nd Yr',svc:2,cn:'c1',date:day(5),time:'1:30 PM',st:'Pending'},
{id:5,sid:'147733',stu:'Carlo Reyes',sub:'BSED 4th Yr',svc:1,cn:'c2',date:day(2),time:'8:30 AM',st:'Approved'},
{id:6,sid:'149054',stu:'Angela Cruz',sub:'BSBA 1st Yr',svc:0,cn:'c3',date:day(5),time:'10:30 AM',st:'Pending'},
{id:7,sid:'148877',stu:'Rhea Mendoza',sub:'BSN 3rd Yr',svc:2,cn:'c1',date:day(7),time:'1:30 PM',st:'Pending'},
{id:8,sid:'146512',stu:'Mark Villanueva',sub:'BSCS 2nd Yr',svc:2,cn:'c2',date:day(-3),time:'8:30 AM',st:'Cancelled'}],
blk:{},refs:[{id:'RF-2026-041',a:'Student A',p:'BSED • Year 2',d:'07 Oct 2026',st:'Awaiting review'},{id:'RF-2026-039',a:'Student B',p:'BEED • Year 1',d:'06 Oct 2026',st:'Scheduled'},{id:'RF-2026-036',a:'Student C',p:'BSED • Year 3',d:'05 Oct 2026',st:'In progress'},{id:'RF-2026-028',a:'Student E',p:'BSED • Year 4',d:'30 Sep 2026',st:'Completed'}],
nt:[['Referral schedule confirmed','RF-2026-039 has been scheduled by GSTC.','Today, 8:15 AM',1],['Referral received','RF-2026-041 is now in the GSTC review queue.','Yesterday, 3:40 PM',1],['Orientation reminder','Class adviser orientation is at the Mabini Seminar Room.','Yesterday, 10:00 AM',1]]});
let S;try{S=JSON.parse(localStorage.getItem('gstc')||'null')}catch(e){}S=S||seed();
const save=()=>{try{localStorage.setItem('gstc',JSON.stringify(S))}catch(e){}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t.t);t.t=setTimeout(()=>t.style.display='none',2600)};
const ACT=['Pending','Approved','Rescheduled'];
const taken=(c,d,t)=>S.bk.some(b=>b.cn==c&&b.date==d&&b.time==t&&ACT.includes(b.st))||S.blk[c+d+t];
const NAV={student:[['student','Dashboard','dash'],['book','Book Appointment','plus'],['mine','My Appointments','cal'],['guide','Office Guidelines','book']],faculty:[['faculty','Dashboard','dash'],['book','Book Appointment','plus'],['mine','My Appointments','cal'],['guide','Office Guidelines','book']],counselor:[['sched','Counselor Schedules','cal'],['mgr','Booking Manager','users'],['rep','Reports & Analytics','chart'],['guide','Office Guidelines','book']]};
const USERS={student:{n:'Juan Dela Cruz Jr.',sid:'145976',sub:'BSIT 3rd Yr',home:'student'},faculty:{n:'Prof. Juan Dela Cruz',sid:'FAC-0231',sub:'College of Teacher Education',home:'faculty'},counselor:{n:'April Virginia M. Plaza',sid:'GCC-0042',sub:'Guidance Counselor',home:'sched'}};
function shell(r,body){const u=S.user,cur=r;return `<div class=cr><span><b>24/7 CRISIS HOTLINE</b> &nbsp; Emergency Lifeline: 0917-GCC-UMTC / (084) 216-2488 loc 114</span><span>Walk-in: Mabini Bldg Rm 204 (Mon-Sat, 8:00 AM - 5:00 PM)</span></div>
<div class=nv><div class=br><div class=lg>UM</div><div><b>UM Tagum - Guidance Services and Testing Center (GSTC)</b><small>Tagum College Student Affairs & Services · GCC Online Portal</small></div></div>
<div class=ut><span>${esc(u.n)}<br><small class=m>${esc(u.sid)} | ${esc(u.sub)}</small></span><button class=sw onclick=out()>Switch Role</button></div></div>
<div class=ws><aside><div><h3>GCC Portal</h3><p>Tagum College Administration</p>${NAV[u.role].map(([h,l,i])=>`<a class="ni ${h==cur?'on':''}" href="#/${h}">${ic(i)}${l}</a>`).join('')}
<div class=hot><b class=m>CRISIS HOTLINE</b><b>0917-GCC-UMTC</b>Emergency Hotline: 0917-GCC-UMTC</div></div><a class=ni onclick=out()>Sign out</a></aside><main>${body}</main></div>`}
function out(){S.user=null;save();location.hash='#/login'}
const stt=s=>`<span class="st ${s}">${s}</span>`;
function modal(h){const m=document.createElement('div');m.className='mdl';m.innerHTML='<div>'+h+'</div>';m.onclick=e=>{if(e.target==m)m.remove()};document.body.appendChild(m);return m}
const closeM=()=>document.querySelectorAll('.mdl').forEach(m=>m.remove());
/* ---- Login ---- */
let L={tab:'student'};
function pgLogin(){return `<div class=cr><span><b>24/7 CRISIS HOTLINE</b> &nbsp; Emergency Lifeline: 0917-GCC-UMTC / (084) 216-2488 loc 114</span><span>Walk-in: Mabini Bldg Rm 204</span></div>
<div class=nv><div class=br><div class=lg>UM</div><div><b>UM Tagum College</b><small>Guidance Services and Testing Center (GSTC)</small></div></div></div>
<div class=lw><div><div class=cb>STUDENT WELFARE & CARE</div><h1 style="font-size:36px;line-height:42px;color:var(--mr)">Compassionate Guidance, Confidential Care</h1><p class=sub style="margin:12px 0 20px">The Guidance Services and Testing Center (GSTC) at UM Tagum provides professional, ethically bound mental health support, academic assistance, appraisal, career, and clinical services to all enrolled students and faculty.</p>
<div class="cd pd" style="margin-bottom:12px"><b>Statutory Privilege & Confidentiality Guarantee</b><p class=mu style="margin-top:6px">Compliant with the Guidance and Counseling Act of 2004 (RA 9258) and the Data Privacy Act of 2012 (RA 10173). Records stay confidential except where there is imminent risk of harm.</p></div>
<div class="cd pd" style="border-color:var(--rd)"><b style="color:var(--mr)">Experiencing severe emotional distress? Do not wait.</b><p class=mu style="margin:6px 0">Walk directly into the GCC Office (Mabini Building, Rm 204) or call our crisis line.</p><a class="bt p" style="display:inline-flex;align-items:center" href="tel:0917">Dial 0917-GCC-UMTC</a></div></div>
<div class="cd pd"><div class=cb>UM ACCESS FORM</div><h1 style="font-size:22px;line-height:28px">GSTC Portal Authentication</h1>
<div class=tabs style="margin:14px 0 0"><button class="${L.tab=='student'?'on':''}" onclick="L.tab='student';render()">Student Portal</button><button class="${L.tab!='student'?'on':''}" onclick="L.tab='faculty';render()">Faculty / Counselor / Staff</button></div>
<form onsubmit="return login(event)">${L.tab!='student'?`<label>Role</label><select id=lr><option value=faculty ${L.tab=='faculty'?'selected':''}>Faculty</option><option value=counselor>Guidance Counselor / Staff</option></select>`:''}
<label>${L.tab=='student'?'Student ID Number or Institutional Email':'Employee ID or Institutional Email'} *</label><input id=lid placeholder="e.g. 145976 or juan.delacruz@umindanao.edu.ph">
<label>Password * <span class=mu style="font-weight:400">(demo: any value)</span></label><input id=lpw type=password placeholder="Enter your UM institutional password">
<label style="font-weight:400"><input type=checkbox style="width:auto"> Remember this workstation for 24 hours</label>
<button class="bt p" style="width:100%;margin-top:12px;height:42px">Sign in to GSTC Portal →</button></form>
<button class=bt style="width:100%;margin-top:10px" onclick="loginAs(L.tab=='student'?'student':'faculty')">Sign in with UM Institutional Google Account</button></div></div>`}
function login(e){e.preventDefault();const id=$('#lid').value.trim(),pw=$('#lpw').value;if(!id||!pw){toast('Enter your ID/email and password.');return false}loginAs(L.tab=='student'?'student':$('#lr').value);return false}
function loginAs(r){S.user={...USERS[r],role:r};save();location.hash='#/'+USERS[r].home;toast('Welcome, '+S.user.n)}
/* ---- Shared appointment bits ---- */
const mine=()=>S.bk.filter(b=>b.sid==S.user.sid).sort((a,b)=>a.date<b.date?-1:1);
const up=b=>b.date>=day(0)&&b.st!='Cancelled'&&b.st!='Completed';
function apRow(b){return `<div class=pd style="display:flex;gap:14px;align-items:center;border-top:1px solid var(--ln);flex-wrap:wrap"><div style="width:52px;text-align:center;background:var(--bl);padding:6px;border-radius:2px"><small class=m>${fmt(b.date).split(' ')[1].toUpperCase()}</small><b style="display:block;font-size:20px;color:var(--mr)">${b.date.slice(8)}</b></div>
<div style="flex:1;min-width:180px"><b>${esc(SV[b.svc][0])}</b><div class=mu>${fmt(b.date)} · ${b.time} · ${cn(b.cn)}</div></div>${stt(b.st)}
<div class=ac>${b.st=='Rescheduled'?`<button class="bt s y" onclick="setSt(${b.id},'Approved')">Confirm new time</button>`:''}${up(b)?`<button class="bt s" onclick="resch(${b.id})">Reschedule</button><button class="lk" onclick="setSt(${b.id},'Cancelled')">Cancel</button>`:''}</div></div>`}
function setSt(id,s){const b=S.bk.find(x=>x.id==id);b.st=s;save();render();toast('Booking '+s.toLowerCase())}
function resch(id){const b=S.bk.find(x=>x.id==id);modal(`<h3>Reschedule appointment</h3><label>New date</label><input type=date id=rd min="${day(1)}" value="${b.date}"><label>Time slot</label><select id=rt>${SL.map(t=>`<option ${t==b.time?'selected':''}>${t}</option>`).join('')}</select><div class=ac style="margin-top:16px"><button class=bt onclick=closeM()>Close</button><button class="bt p" onclick="doResch(${id})">Save</button></div>`)}
function doResch(id){const b=S.bk.find(x=>x.id==id),d=$('#rd').value,t=$('#rt').value;if(!d||d<=day(0)){toast('Pick a future date.');return}if(taken(b.cn,d,t)&&!(d==b.date&&t==b.time)){toast('That slot is already taken.');return}b.date=d;b.time=t;b.st=S.user.role=='counselor'?'Rescheduled':'Pending';save();closeM();render();toast('Appointment rescheduled')}
function pgStudent(){const m=mine(),n=m.filter(up),nx=n[0];return `<div><div class=cb>STUDENT PORTAL / OVERVIEW</div><h1>Hello, ${esc(S.user.n.split(' ')[0])}.</h1><p class=sub>Your guidance appointments, in one place.</p></div>
<div class="cd pd" style="background:var(--rd);color:#fff;border:0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center">${nx?`<div><small>NEXT APPOINTMENT</small><h1 style="font-size:22px">${esc(SV[nx.svc][0])}</h1><div>${fmt(nx.date)} · ${nx.time} · ${cn(nx.cn)}</div></div><a class="bt y" style="display:inline-flex;align-items:center" href="#/mine">Manage booking</a>`:`<div><h1 style="font-size:22px">No upcoming appointments</h1><div>Book a confidential consultation.</div></div><a class="bt y" style="display:inline-flex;align-items:center" href="#/book">Book now</a>`}</div>
<div class="gr g4">${['Pending','Approved','Completed','Cancelled'].map(s=>`<div class="cd mt"><div class=n>${m.filter(b=>b.st==s).length}</div><small>${s}</small></div>`).join('')}</div>
<div class=cd><div class=sh><b>Upcoming</b><a class=lk href="#/mine">View all →</a></div>${n.slice(0,3).map(apRow).join('')||'<div class=pd>Nothing scheduled.</div>'}</div>`}
let MT='up';
function pgMine(){const m=mine(),l=m.filter(b=>MT=='up'?up(b):!up(b));return `<div class=hd><div><h1>My appointments</h1><p class=sub>View, reschedule or cancel your guidance bookings.</p></div><a class="bt y" style="display:inline-flex;align-items:center" href="#/book">Book appointment</a></div>
<div class=tabs><button class="${MT=='up'?'on':''}" onclick="MT='up';render()">Upcoming</button><button class="${MT!='up'?'on':''}" onclick="MT='past';render()">Past & cancelled</button></div><div class=cd>${l.map(apRow).join('')||'<div class=pd>No appointments here.</div>'}</div>`}
/* ---- Booking ---- */
let B={svc:null,cn:null,date:null,slot:null,mode:'In-person',concern:'',ph:'',rel:'',ok:false,mo:new Date(new Date().getFullYear(),new Date().getMonth(),1)};
function pgBook(){const mo=B.mo,first=mo.getDay(),dim=new Date(mo.getFullYear(),mo.getMonth()+1,0).getDate(),cells=[];for(let i=0;i<first;i++)cells.push('<span></span>');
for(let d=1;d<=dim;d++){const i=ymd(new Date(mo.getFullYear(),mo.getMonth(),d)),w=new Date(i+'T00:00').getDay(),off=i<=day(0)||w==0;cells.push(`<button class="${off?'x':''} ${B.date==i?'on':''}" ${off?'':`onclick="B.date='${i}';B.slot=null;render()"`}>${d}</button>`)}
return `<div><div class=mu>Home › Appointments › New Booking</div><h1>Schedule a Counseling Consultation</h1><p class=sub>Book a safe, confidential guidance appointment with accredited UM Tagum counselors.</p></div>
<div class="cd pd"><b><span class=stp>1</span>Select Counseling Nature / Service</b><div class="gr g3" style="margin-top:12px">${SV.map((s,i)=>`<button class="opt ${B.svc===i?'on':''}" onclick="B.svc=${i};render()"><b>${s[0]}</b><small>${s[2]}</small><br><small class=m>⏱ ${s[1]}</small></button>`).join('')}</div></div>
<div class="cd pd"><b><span class=stp>2</span>Choose Counselor</b><div class="gr g3" style="margin-top:12px">${C.map(c=>`<button class="opt ${B.cn==c.id?'on':''}" onclick="B.cn='${c.id}';B.slot=null;render()"><b>${c.n}</b><small>${c.cr} · ${c.r}</small><br><small>${c.col}<br>📍 ${c.rm}, Mabini Bldg</small></button>`).join('')}</div></div>
<div class="cd pd"><b><span class=stp>3</span>Select Date & Time Slot</b><div class="gr" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:12px"><div class="cd pd"><div class=ac style="justify-content:space-between;margin-bottom:8px"><b>${mo.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</b><span><button class="bt s" onclick="B.mo=new Date(B.mo.getFullYear(),B.mo.getMonth()-1,1);render()">‹</button> <button class="bt s" onclick="B.mo=new Date(B.mo.getFullYear(),B.mo.getMonth()+1,1);render()">›</button></span></div><div class=cal>${'SMTWTFS'.split('').map(d=>`<small class=mu>${d}</small>`).join('')}${cells.join('')}</div></div>
<div>${!B.date||!B.cn?'<p class=mu>Choose a counselor and a date to see available slots.</p>':`<p class=mu style="margin-bottom:8px">Slots for <b>${fmt(B.date)}</b></p><div class="gr" style="grid-template-columns:1fr 1fr 1fr">${SL.map(t=>{const x=taken(B.cn,B.date,t);return `<button class="sl ${x?'x':''} ${B.slot==t?'on':''}" ${x?'':`onclick="B.slot='${t}';render()"`}>${t}<br><small>${x?'Booked':B.slot==t?'Selected':'Available'}</small></button>`}).join('')}</div>`}<p class=mu style="margin-top:12px;border-left:3px solid var(--gd);padding:8px 12px;background:var(--bl)">Arrive or log in 10 minutes prior. Appointments unconfirmed 15 minutes past schedule are marked as no-show.</p></div></div></div>
<div class="cd pd"><b><span class=stp>4</span>Intake Information & Session Details</b><div class="gr g3" style="margin-top:12px">${['In-person','Online Tele-Counseling'].map(m=>`<button class="opt ${B.mode==m?'on':''}" onclick="B.mode='${m}';render()"><b>${m=='In-person'?'In-person Consultation':'Online Tele-Counseling (Google Meet)'}</b><small>${m=='In-person'?'GCC Office, 2nd Floor, Mabini Building.':'Video link sent to your institutional email.'}</small></button>`).join('')}</div>
<label>Brief description of concern *</label><textarea rows=4 maxlength=500 placeholder="Please provide brief context…" oninput="B.concern=this.value">${esc(B.concern)}</textarea>
<div class="gr" style="grid-template-columns:1fr 1fr"><div><label>Emergency contact number *</label><input value="${esc(B.ph)}" oninput="B.ph=this.value" placeholder="+63 917 000 0000"></div><div><label>Relationship *</label><input value="${esc(B.rel)}" oninput="B.rel=this.value" placeholder="Mother (Mrs. Corazon Dela Cruz)"></div></div>
<label style="font-weight:400;background:var(--bl);padding:12px;margin-top:14px"><input type=checkbox style="width:auto" ${B.ok?'checked':''} onchange="B.ok=this.checked"> I acknowledge that disclosures are confidential under RA 9258 and RA 10173, except where there is imminent threat of harm to self or others.</label></div>
<div class=ac><button class=bt onclick="draft()">Cancel / Save Draft</button><button class="bt p" onclick="submitB()">Submit Appointment Request ➤</button></div>`}
function draft(){toast('Draft saved for this session.')}
function submitB(){const e=[];if(B.svc===null)e.push('a service');if(!B.cn)e.push('a counselor');if(!B.date||!B.slot)e.push('a date and time slot');if(B.concern.trim().length<10)e.push('a brief description (10+ chars)');if(!/^[+\d][\d\s-]{6,}$/.test(B.ph.trim()))e.push('a valid emergency number');if(!B.rel.trim())e.push('the relationship');if(!B.ok)e.push('the confidentiality acknowledgment');
if(e.length){toast('Please provide '+e[0]+(e.length>1?' (+'+(e.length-1)+' more)':''));return}
const u=S.user;S.bk.push({id:S.id++,sid:u.sid,stu:u.n,sub:u.sub,svc:B.svc,cn:B.cn,date:B.date,time:B.slot,st:'Pending',note:B.concern});save();B={...B,svc:null,cn:null,date:null,slot:null,concern:'',ph:'',rel:'',ok:false};location.hash='#/mine';toast('Request submitted — awaiting counselor approval')}
/* ---- Faculty ---- */
function pgFaculty(){const m=mine().filter(up),r=S.refs,un=S.nt.filter(n=>n[3]).length;return `<div class=hd><div><div class=cb>FACULTY PORTAL / OVERVIEW</div><h1>Good morning, Prof. Dela Cruz.</h1><p class=sub>Your guidance appointments and student support updates, in one place.</p></div><div style="text-align:right"><p class=mu>Thursday, 08 October 2026</p><button class="bt p" onclick="refer()">Refer a student</button></div></div>
<div class="gr g4">${[['Upcoming appointments',m.length],['Active student referrals',r.length],['Awaiting GSTC review',r.filter(x=>x.st=='Awaiting review').length],['Completed referrals',r.filter(x=>x.st=='Completed').length]].map(([a,b])=>`<div class="cd mt"><small><b>${a}</b></small><div class=n>${String(b).padStart(2,'0')}</div></div>`).join('')}</div>
<div class="cd pd" style="background:var(--bl);padding:10px 16px">Faculty access shows scheduling and referral status only. Counseling notes remain confidential. <span class=m style="color:var(--gd);font-size:9px">DEMO DATA</span></div>
<div class="gr g2"><div style="display:flex;flex-direction:column;gap:20px;min-width:0"><div class=cd><div class=sh><div><b>Upcoming guidance appointments</b><small>Your schedule</small></div><a class=lk href="#/mine">View all →</a></div>${m.slice(0,3).map(apRow).join('')||'<div class=pd>No upcoming appointments.</div>'}</div>
<div class=cd><div class=sh><div><b>Student referrals</b><small>Track requests you submitted to GSTC</small></div></div><div class=tb><table><tr><th>REFERENCE</th><th>STUDENT / PROGRAM</th><th>SUBMITTED</th><th>STATUS</th></tr>${r.map(x=>`<tr><td class=m>${x.id}</td><td><b>${esc(x.a)}</b><small>${esc(x.p)}</small></td><td>${x.d}</td><td><span class="st ${x.st=='Completed'?'Approved':x.st=='Scheduled'?'Cancelled':x.st=='In progress'?'Rescheduled':'Pending'}">${x.st}</span></td></tr>`).join('')}</table></div></div></div>
<div style="display:flex;flex-direction:column;gap:20px"><div class=cd><div class=sh><b>Quick actions</b></div><div class=pd style="display:grid;gap:8px"><a class=bt style="display:grid;place-items:center" href="#/book">Book a guidance appointment</a><a class=bt style="display:grid;place-items:center" href="#/guide">Open referral guidelines</a><button class=bt onclick="refer()">Submit a referral</button></div></div>
<div class=cd><div class=sh><div><b>Recent notifications</b><small>${un} unread updates</small></div></div>${S.nt.map(n=>`<div class=pd style="border-top:1px solid var(--ln);padding:12px 18px"><b>${n[0]}${n[3]?'<i class=un></i>':''}</b><p class=mu>${n[1]}</p><small class=m>${n[2]}</small></div>`).join('')}<div class=pd style="padding:12px 18px"><button class=lk onclick="S.nt.forEach(n=>n[3]=0);save();render()">Mark all as read</button></div></div>
<div class="cd pd" style="border-top:3px solid var(--gd)"><b style="color:var(--mr)">📍 Your campus GSTC office</b><p class=mu style="margin-top:6px">Mabini Building, Room 204<br>Mon–Sat • 8:00 AM–5:00 PM<br>(084) 216-2488 loc 114</p></div></div></div>`}
function refer(){modal(`<h3>Refer a student</h3><label>Student alias</label><input id=ra placeholder="e.g. Student F"><label>Program / year</label><input id=rp placeholder="e.g. BSED • Year 2"><label>Reason for referral</label><textarea id=rr rows=3></textarea><div class=ac style="margin-top:16px"><button class=bt onclick=closeM()>Cancel</button><button class="bt p" onclick="doRef()">Submit referral</button></div>`)}
function doRef(){const a=$('#ra').value.trim(),p=$('#rp').value.trim(),r=$('#rr').value.trim();if(!a||!p||r.length<5){toast('Please complete all fields.');return}S.refs.unshift({id:'RF-2026-0'+(42+S.refs.length),a,p,d:'08 Oct 2026',st:'Awaiting review'});S.nt.unshift(['Referral received','Your referral is now in the GSTC review queue.','Just now',1]);save();closeM();render();toast('Referral submitted')}
/* ---- Counselor ---- */
let SF='All',SQ='',SC='All',WK=0;
function pgMgr(){const a=S.bk,l=a.filter(b=>(SF=='All'||b.st==SF)&&(SC=='All'||b.cn==SC)&&(b.stu+b.sid).toLowerCase().includes(SQ.toLowerCase())),cnt=s=>a.filter(b=>b.st==s).length;
return `<div class=hd><div><h1>Bookings manager</h1><p class=sub>Review requests, approve or reschedule, and keep counselor schedules free of overlaps.</p></div><button class=bt onclick=exp()>Export records</button></div>
<div class="gr g4">${[['Needs review','Pending'],['Approved this week','Approved'],['Rescheduled','Rescheduled'],['Cancelled','Cancelled']].map(([t,s])=>`<div class="cd mt"><div class=n style="color:var(--tx)">${cnt(s)}</div><small>${t}</small></div>`).join('')}</div>
<div class=hd><div class=tabs>${['All','Pending','Approved','Rescheduled','Cancelled'].map(s=>`<button class="${SF==s?'on':''}" onclick="SF='${s}';render()">${s} (${s=='All'?a.length:cnt(s)})</button>`).join('')}</div><div style="display:flex;gap:8px"><input style="width:200px" placeholder="Search student name or ID" value="${esc(SQ)}" oninput="SQ=this.value;render(1)" id=q><select style="width:180px" onchange="SC=this.value;render()"><option value=All>All counselors</option>${C.map(c=>`<option value=${c.id} ${SC==c.id?'selected':''}>${c.n}</option>`).join('')}</select></div></div>
<div class="cd tb"><table><tr><th>Student</th><th>Service</th><th>Counselor</th><th>Requested time</th><th>Status</th><th style="text-align:right">Actions</th></tr>${l.map(b=>`<tr><td><b>${esc(b.stu)}</b><small>${b.sid} · ${b.sub}</small></td><td>${SV[b.svc][0]}</td><td>${cn(b.cn)}</td><td>${fmt(b.date)}<small>${b.time}</small></td><td>${stt(b.st)}</td><td><div class=ac>${b.st=='Pending'?`<button class="bt s y" onclick="setSt(${b.id},'Approved')">Approve</button><button class="bt s" onclick="resch(${b.id})">Reschedule</button><button class=lk onclick="setSt(${b.id},'Declined')">Decline</button>`:b.st=='Cancelled'||b.st=='Declined'||b.st=='Completed'?`<button class="bt s" onclick="det(${b.id})">View details</button>`:`<button class="bt s" onclick="resch(${b.id})">Reschedule</button><button class=lk onclick="setSt(${b.id},'Cancelled')">Cancel</button>`}</div></td></tr>`).join('')||'<tr><td colspan=6>No matching requests.</td></tr>'}</table></div>
<p class=mu>Showing ${l.length} of ${a.length} requests. Student records are confidential.</p>`}
function det(id){const b=S.bk.find(x=>x.id==id);modal(`<h3>${esc(b.stu)}</h3><p class=mu>${b.sid} · ${b.sub}</p><p style="margin:10px 0">${SV[b.svc][0]}<br>${cn(b.cn)} · ${fmt(b.date)} · ${b.time}<br>${stt(b.st)}</p>${b.note?`<p class=mu>Concern: ${esc(b.note)}</p>`:''}<button class=bt onclick=closeM()>Close</button>`)}
function exp(){const r=[['ID','Student','Service','Counselor','Date','Time','Status'],...S.bk.map(b=>[b.sid,b.stu,SV[b.svc][0],cn(b.cn),b.date,b.time,b.st])];const u=URL.createObjectURL(new Blob([r.map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'}));const a=document.createElement('a');a.href=u;a.download='bookings.csv';a.click();toast('Exported bookings.csv')}
function pgSched(){const mon=new Date();mon.setDate(mon.getDate()-((mon.getDay()+6)%7)+WK*7);const ds=[0,1,2,3,4].map(i=>{const d=new Date(mon);d.setDate(d.getDate()+i);return ymd(d)});
return `<div class=hd><div><h1>Counselor schedules</h1><p class=sub>Click a cell to block or open slots. Booked slots can't be changed.</p></div><div class=ac><button class=bt onclick="WK--;render()">‹ Prev</button><button class=bt onclick="WK=0;render()">This week</button><button class=bt onclick="WK++;render()">Next ›</button></div></div>
<div class="cd tb"><table><tr><th>Counselor</th>${ds.map(d=>`<th>${fmt(d)}</th>`).join('')}</tr>${C.map(c=>`<tr><td><b>${c.n}</b><small>${c.rm}</small></td>${ds.map(d=>{const o=SL.filter(t=>!taken(c.id,d,t)).length;return `<td><button class="st ${o?'Approved':'Cancelled'}" style="border:0" onclick="slots('${c.id}','${d}')">${o} open</button></td>`}).join('')}</tr>`).join('')}</table></div>`}
function slots(c,d){modal(`<h3>${cn(c)} · ${fmt(d)}</h3><div class=gr style="grid-template-columns:1fr 1fr;margin:14px 0">${SL.map(t=>{const bk=S.bk.some(b=>b.cn==c&&b.date==d&&b.time==t&&ACT.includes(b.st)),bl=S.blk[c+d+t];return `<button class="sl ${bk?'x':bl?'':'on'}" style="${bl?'border-style:dashed':''}" ${bk?'':`onclick="tg('${c}','${d}','${t}')"`}>${t}<br><small>${bk?'Booked':bl?'Blocked — click to open':'Open — click to block'}</small></button>`}).join('')}</div><button class=bt onclick=closeM()>Done</button>`)}
function tg(c,d,t){const k=c+d+t;if(S.blk[k])delete S.blk[k];else S.blk[k]=1;save();closeM();slots(c,d);render()}
function pgRep(){const a=S.bk,t=a.length,ap=a.filter(b=>b.st=='Approved'||b.st=='Completed').length,cx=a.filter(b=>b.st=='Cancelled').length,bs=(arr,k)=>arr.map(([n,v])=>`<div style="margin:10px 0"><div style="display:flex;justify-content:space-between"><span>${n}</span><b>${v}</b></div><div class=bar><i style="width:${t?v/Math.max(1,...arr.map(x=>x[1]))*100:0}%"></i></div></div>`).join('');
const sc=['Approved','Pending','Completed','Rescheduled','Cancelled'].map(s=>[s,a.filter(b=>b.st==s).length]),cols=['#2f7d57','#e8b923','#7fb69a','#4a6fd0','#7b1113'];let acc=0;const cg=sc.map(([,v],i)=>{const s=acc;acc+=t?v/t*100:0;return cols[i]+' '+s+'% '+acc+'%'}).join(',');
const wd=['Mon','Tue','Wed','Thu','Fri'].map((d,i)=>[d,a.filter(b=>new Date(b.date+'T00:00').getDay()==i+1).length]);
return `<div><h1>Reports & analytics</h1><p class=sub>Live figures computed from current bookings.</p></div>
<div class="gr g4">${[['Total appointments',t],['Approval rate',t?Math.round(ap/t*100)+'%':'0%'],['Cancellation rate',t?Math.round(cx/t*100)+'%':'0%'],['Pending review',a.filter(b=>b.st=='Pending').length]].map(([x,y])=>`<div class="cd mt"><small>${x}</small><div class=n>${y}</div></div>`).join('')}</div>
<div class="gr" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="cd pd"><b>Status breakdown</b><div style="display:flex;gap:20px;align-items:center;margin-top:14px;flex-wrap:wrap"><div style="width:130px;height:130px;border-radius:50%;background:conic-gradient(${cg});-webkit-mask:radial-gradient(circle 40px,transparent 98%,#000);mask:radial-gradient(circle 40px,transparent 98%,#000)"></div><div>${sc.map(([s,v],i)=>`<div><i style="display:inline-block;width:10px;height:10px;background:${cols[i]};margin-right:6px"></i>${s}: ${v}</div>`).join('')}</div></div></div>
<div class="cd pd"><b>Requests by service type</b>${bs(SV.map((s,i)=>[s[0],a.filter(b=>b.svc==i).length]))}</div><div class="cd pd"><b>Counselor workload</b>${bs(C.map(c=>[c.n,a.filter(b=>b.cn==c.id).length]))}</div><div class="cd pd"><b>Busiest days</b>${bs(wd)}</div></div>`}
function pgGuide(){return `<div><h1>Office guidelines</h1><p class=sub>What to expect from GSTC, and how to book.</p></div>
<div class="gr" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="cd pd"><b>Services we offer</b>${['Psychological counseling','Mental health screening','Career guidance','Student orientation','Individual inventory & assessment'].map(s=>`<p style="margin-top:8px">• ${s}</p>`).join('')}</div>
<div class="cd pd"><b>Office hours</b><p style="margin-top:8px">Monday – Friday: 8:00 AM – 5:00 PM<br>Saturday: 8:00 AM – 12:00 PM<br>Sunday: Closed<br><span class=mu>GCC Office, Mabini Bldg Rm 204</span></p></div>
<div class="cd pd"><b>How booking works</b>${['Choose a counselor and service','Submit your request','Wait for confirmation','Attend your session'].map((s,i)=>`<p style="margin-top:8px"><span class=stp>${i+1}</span>${s}</p>`).join('')}</div>
<div class="cd pd"><b>Policies & exclusions</b><p class=mu style="margin-top:8px">Counseling sessions are confidential, except where there is imminent risk. The portal is not for emergencies — call 0917-GCC-UMTC. Cancel at least 24 hours in advance.</p></div></div>
<div class="cd pd"><b>Frequently asked questions</b>${[['Can I book more than one appointment at a time?','Yes, as long as the slots do not overlap.'],['What if my counselor is unavailable?','Choose another counselor or reschedule to a different date.'],['Is my information kept private?','Yes. Only assigned licensed counselors can view session details.']].map(q=>`<details><summary>${q[0]}</summary><p class=mu style="margin-top:6px">${q[1]}</p></details>`).join('')}</div>`}
const PG={student:pgStudent,mine:pgMine,book:pgBook,faculty:pgFaculty,mgr:pgMgr,sched:pgSched,rep:pgRep,guide:pgGuide};
function render(keep){const r=(location.hash.replace('#/','')||'login'),u=S.user;
if(!u){if(r!='login'){location.hash='#/login';return}$('#app').innerHTML=pgLogin();return}
if(r=='login'||!NAV[u.role].some(n=>n[0]==r)){location.hash='#/'+u.home;return}
$('#app').innerHTML=shell(r,PG[r]());window.scrollTo(0,0);if(keep){const q=$('#q');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}}
addEventListener('hashchange',()=>render());render();
</script></body></html>
